[project]
site_name = "udfx"
site_url = "https://guan404ming.github.io/udfx/"
site_description = "Compile Python UDFs into native dataframe expressions"
repo_url = "https://github.com/guan404ming/udfx"
repo_name = "guan404ming/udfx"
edit_uri = "edit/main/docs/"
exclude_docs = "benchmarks/*.md"
extra_css = ["stylesheets/extra.css"]
nav = [
    { "Home" = "index.md" },
    { "User Guide" = [
        { "Overview" = "user-guide.md" },
        { "Getting Started" = [
            { "Installation" = "installation.md" },
            { "Quick Start" = "quickstart.md" },
        ] },
        { "Core Concepts" = [
            { "How It Works" = "how-it-works.md" },
            { "Supported Patterns" = "python.md" },
        ] },
        { "Backends" = [
            { "Overview" = "backends.md" },
            { "Polars" = "backends/polars.md" },
            { "DuckDB" = "backends/duckdb.md" },
            { "Apache DataFusion" = "backends/datafusion.md" },
            { "Apache Spark" = [
                { "Overview" = "backends/spark.md" },
                { "Apache DataFusion Comet" = "comet.md" },
            ] },
        ] },
    ] },
    { "Reference API" = [
        { "Overview" = "api.md" },
        { "Python API" = [
            { "udfx.compile" = "compile.md" },
            { "udfx.explain" = "explain.md" },
            { "udfx.types" = "types.md" },
        ] },
    ] },
    { "Contributor Guide" = [
        { "Overview" = "contributor-guide.md" },
        { "Development" = [
            { "Development Setup" = "contributing.md" },
            { "Compiler Structure" = "architecture.md" },
        ] },
        { "Validation" = [
            { "Testing" = "testing.md" },
            { "Benchmarking" = "benchmarking.md" },
            { "Public Datasets" = "datasets.md" },
        ] },
    ] },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.path",
    "navigation.footer",
    "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false
