source = { editable = "." }

[package.optional-dependencies]
datafusion = [
    { name = "datafusion" },
]
duckdb = [
    { name = "duckdb" },
    { name = "numpy" },
    { name = "pyarrow" },
]
polars = [
    { name = "polars" },
]
spark = [
    { name = "pyarrow" },
    { name = "pyspark" },
]
testing = [
    { name = "hypothesis" },
]

[package.dev-dependencies]
dev = [
    { name = "datafusion" },
    { name = "duckdb" },
    { name = "hypothesis" },
    { name = "numpy" },
    { name = "pandas" },
    { name = "polars" },
    { name = "pyarrow-stubs" },
    { name = "pyright" },
    { name = "pyspark" },
    { name = "pytest" },
    { name = "pytest-xdist" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "datafusion", marker = "extra == 'datafusion'", specifier = ">=50" },
    { name = "duckdb", marker = "extra == 'duckdb'", specifier = ">=1.4" },
    { name = "hypothesis", marker = "extra == 'testing'", specifier = ">=6.100" },
    { name = "numpy", marker = "extra == 'duckdb'", specifier = ">=2.0" },
    { name = "polars", marker = "extra == 'polars'", specifier = ">=2.0" },
    { name = "pyarrow", marker = "extra == 'duckdb'", specifier = ">=18" },
    { name = "pyarrow", marker = "extra == 'spark'", specifier = ">=18" },
    { name = "pyspark", marker = "extra == 'spark'", specifier = ">=4.1" },
]
provides-extras = ["polars", "duckdb", "datafusion", "spark", "testing"]

[package.metadata.requires-dev]
dev = [
    { name = "datafusion", specifier = ">=50" },
    { name = "duckdb", specifier = ">=1.4" },
    { name = "hypothesis", specifier = ">=6.100" },
    { name = "numpy", specifier = ">=2.0" },
    { name = "pandas", specifier = ">=2.2,<3" },
    { name = "polars", specifier = ">=2.0" },
    { name = "pyarrow-stubs", specifier = ">=20.0.0.20260819" },
    { name = "pyright", specifier = ">=1.1.390" },
    { name = "pyspark", specifier = ">=4.1" },
    { name = "pytest", specifier = ">=8.3" },
    { name = "pytest-xdist", specifier = ">=3.8.0" },
    { name = "ruff", specifier = ">=0.7" },
]
