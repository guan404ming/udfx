name: Benchmark

on:
  workflow_dispatch:

concurrency:
  group: benchmark-5090
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, udfx-benchmark]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync --locked --python 3.12
      - run: uv run python -m workloads.prepare
      - run: uv run python -m bench --threads 8 --output results/benchmark.json
      - if: always()
        run: uv run python -m bench.report results/benchmark.json --markdown results/report.md --csv results/report.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ github.sha }}
          path: |
            results/*.json
            results/*.md
            results/*.csv
