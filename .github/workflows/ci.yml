name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} ruff check .
      - run: uv run --python ${{ matrix.python }} ruff format --check .
      - run: uv run --python ${{ matrix.python }} pyright
      - run: uv run --python ${{ matrix.python }} pytest
        env:
          HYPOTHESIS_PROFILE: ci
          UDFX_TESTS: full
      - run: uv run --python ${{ matrix.python }} pytest -m corpus
        env:
          HYPOTHESIS_PROFILE: ci
          UDFX_TESTS: full
