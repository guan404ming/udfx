[project]
name = "udfx"
version = "0.1.0"
description = "Turn Python UDFs into native dataframe expressions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = []
authors = [{ name = "Guan-Ming Chiu", email = "guanmingchiu@gmail.com" }]
keywords = ["udf", "dataframe", "compiler", "polars", "duckdb", "datafusion", "spark"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/guan404ming/udfx"
Documentation = "https://guan404ming.github.io/udfx/"
Issues = "https://github.com/guan404ming/udfx/issues"

[project.optional-dependencies]
polars = ["polars>=2.0"]
duckdb = ["duckdb>=1.4.1", "numpy>=2.0", "pyarrow>=18"]
datafusion = ["datafusion>=55", "pyarrow>=18"]
spark = ["pyspark>=4.1", "pyarrow>=18"]
testing = ["hypothesis>=6.100"]

[dependency-groups]
dev = [
    "polars>=2.0",
    "duckdb>=1.4.1",
    "numpy>=2.0",
    "pandas>=2.2,<3",
    "datafusion>=55",
    "pyspark>=4.1",
    "hypothesis>=6.100",
    "pytest>=8.3",
    "ruff>=0.7",
    "pyright>=1.1.390",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7",
]
docs = [
    "zensical>=0.0.72",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv*",
    ".github",
    ".hypothesis",
    ".python-version",
    "AGENTS.md",
    "CLAUDE.md",
    "bench",
    "tests",
    "workloads",
    "patches",
    "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR2004", "PLR0911", "PLR0913", "N818"]

[tool.ruff.lint.per-file-ignores]
"src/udfx/testing/strategies.py" = ["RUF001"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"
reportUnknownParameterType = "none"
include = ["src", "tests", "bench", "workloads"]
extraPaths = ["tests"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-n auto --maxprocesses=4 --dist loadgroup -m \"not corpus and not public\" --durations=5"
markers = [
    "corpus: acceptance corpus, run with -m corpus",
    "public: external UDFBench correctness, requires explicit data preparation",
]
junit_family = "xunit1"

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/udfx", "bench", "workloads"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
