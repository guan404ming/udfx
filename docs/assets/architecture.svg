<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 824" role="img" aria-labelledby="title description">
  <title id="title">udfx project architecture</title>
  <desc id="description">A Python UDF and input schema enter the shared udfx compiler. It traces Python, builds a shared program, and lowers expressions through a Polars, DuckDB, DataFusion, or Spark adapter. The resulting expression runs in the user's dataframe query. Rows use native execution where it matches Python and the original Python function otherwise.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#858585"/>
    </marker>
  </defs>
  <rect width="960" height="824" rx="20" fill="#ffffff"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#262626">
    <rect x="20" y="20" width="920" height="112" rx="18" fill="#f5f5f5" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="44" y="63" font-size="24" font-weight="700">Python UDF + input schema</text>
    <text x="44" y="101" font-size="18">Pass a function, column types, and a backend to udfx.compile.</text>
    <rect x="782" y="40" width="134" height="32" rx="16" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="849" y="62" text-anchor="middle" font-size="14" font-weight="600">Your code</text>

    <path d="M 480 134 V 183" fill="none" stroke="#858585" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="164" font-size="17" fill="#606060">Compile once, reuse the expression</text>

    <rect x="20" y="190" width="920" height="180" rx="18" fill="#262626" stroke="#858585" stroke-width="2"/>
    <text x="44" y="233" font-size="24" font-weight="700" fill="#ffffff">Shared udfx compiler</text>
    <text x="44" y="267" font-size="18" fill="#d5d5d5">Trace supported Python and preserve its results and exceptions.</text>
    <rect x="44" y="290" width="260" height="54" rx="10" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1.5"/>
    <text x="174" y="324" text-anchor="middle" font-size="18" font-weight="600">Trace Python</text>
    <path d="M 312 317 H 340" fill="none" stroke="#858585" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="350" y="290" width="260" height="54" rx="10" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1.5"/>
    <text x="480" y="324" text-anchor="middle" font-size="18" font-weight="600">Shared program</text>
    <path d="M 618 317 H 646" fill="none" stroke="#858585" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="656" y="290" width="260" height="54" rx="10" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1.5"/>
    <text x="786" y="324" text-anchor="middle" font-size="18" font-weight="600">Lower expressions</text>

    <path d="M 480 372 V 413" fill="none" stroke="#858585" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="399" font-size="17" fill="#606060">Use the selected backend</text>

    <rect x="20" y="420" width="920" height="140" rx="18" fill="#f5f5f5" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="44" y="460" font-size="24" font-weight="700">Backend adapters</text>
    <rect x="44" y="478" width="206" height="62" rx="10" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="147" y="504" text-anchor="middle" font-size="18" font-weight="600">Polars</text>
    <text x="147" y="527" text-anchor="middle" font-size="16">polars.Expr</text>
    <rect x="266" y="478" width="206" height="62" rx="10" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="369" y="504" text-anchor="middle" font-size="18" font-weight="600">DuckDB</text>
    <text x="369" y="527" text-anchor="middle" font-size="16">duckdb.Expression</text>
    <rect x="488" y="478" width="206" height="62" rx="10" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="591" y="504" text-anchor="middle" font-size="18" font-weight="600">DataFusion</text>
    <text x="591" y="527" text-anchor="middle" font-size="16">datafusion.Expr</text>
    <rect x="710" y="478" width="206" height="62" rx="10" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="813" y="504" text-anchor="middle" font-size="18" font-weight="600">Spark</text>
    <text x="813" y="527" text-anchor="middle" font-size="16">pyspark.sql.Column</text>

    <path d="M 480 562 V 613" fill="none" stroke="#858585" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="593" font-size="17" fill="#606060">Add translation.expr to your query</text>

    <rect x="20" y="620" width="920" height="184" rx="18" fill="#f5f5f5" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="44" y="661" font-size="24" font-weight="700">Dataframe Query</text>
    <rect x="44" y="684" width="428" height="96" rx="10" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="64" y="720" font-size="20" font-weight="700">Native engine execution</text>
    <text x="64" y="753" font-size="18">Rows where native results match Python</text>
    <rect x="488" y="684" width="428" height="96" rx="10" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>
    <text x="508" y="720" font-size="20" font-weight="700">Python fallback</text>
    <text x="508" y="753" font-size="18">Original function for remaining rows</text>
  </g>
</svg>
