<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352.8" version="1.1" role="img" aria-labelledby="title description">
  <title id="title">UDFBench speedups by engine</title>
  <desc id="description">Geometric mean speedups over 24 selected UDFs. Python UDF baseline is 1×. Polars: memory 2.05×, query 1.57×. DuckDB: memory 1.41×, query 1.19×. Apache DataFusion: memory 1.12×, query 1.18×. Apache Spark: memory 1.58×, query 1.10×.</desc>
